<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배민 파트너 입점 초기 운영 Q&A 가이드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: #f8f9fa; color: #1a1a1a; }
  .top-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: #fff; border-bottom: 1px solid #e9ecef; }
  .nav-inner { max-width: 960px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; gap: 16px; height: 56px; }
  .nav-logo { font-size: 14px; font-weight: 700; color: #1a1a1a; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .logo-badge { background: #1de5a2; color: #004d35; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .search-wrap { flex: 1; position: relative; }
  .search-wrap input { width: 100%; height: 36px; border: 1.5px solid #e9ecef; border-radius: 20px; padding: 0 36px 0 14px; font-size: 14px; color: #1a1a1a; background: #f8f9fa; outline: none; transition: border-color .2s; }
  .search-wrap input:focus { border-color: #1de5a2; background: #fff; }
  .search-wrap input::placeholder { color: #adb5bd; }
  .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #adb5bd; font-size: 15px; pointer-events: none; }
  .anchor-bar { position: fixed; top: 56px; left: 0; right: 0; z-index: 99; background: #fff; border-bottom: 1px solid #e9ecef; overflow-x: auto; scrollbar-width: none; }
  .anchor-bar::-webkit-scrollbar { display: none; }
  .anchor-inner { max-width: 960px; margin: 0 auto; padding: 0 20px; display: flex; gap: 4px; height: 44px; align-items: center; white-space: nowrap; }
  .anchor-btn { height: 32px; padding: 0 14px; border-radius: 16px; border: none; background: transparent; font-size: 13px; font-weight: 500; color: #6c757d; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 6px; }
  .anchor-btn:hover { background: #f1f3f5; color: #1a1a1a; }
  .anchor-btn.active { background: #e6fdf5; color: #0a9160; font-weight: 600; }
  .anchor-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .5; }
  .page { max-width: 960px; margin: 0 auto; padding: 120px 20px 60px; }
  .hero { background: linear-gradient(135deg, #e6fdf5 0%, #f0fff8 100%); border-radius: 16px; padding: 32px 36px; margin-bottom: 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .hero-text h1 { font-size: 21px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; line-height: 1.4; }
  .hero-text p { font-size: 14px; color: #495057; line-height: 1.65; }
  .hero-stats { display: flex; gap: 24px; flex-shrink: 0; }
  .hero-stat { text-align: center; }
  .hero-stat strong { display: block; font-size: 28px; font-weight: 700; color: #0a9160; }
  .hero-stat span { font-size: 12px; color: #6c757d; }
  .section { margin-bottom: 48px; scroll-margin-top: 120px; }
  .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #e9ecef; }
  .section-num { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .section-title { font-size: 18px; font-weight: 700; color: #1a1a1a; }
  .section-count { margin-left: auto; font-size: 12px; color: #adb5bd; background: #f1f3f5; padding: 3px 10px; border-radius: 12px; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid #e9ecef; border-radius: 12px; padding: 18px 18px 14px; cursor: pointer; transition: all .2s; position: relative; display: flex; flex-direction: column; }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); transform: translateY(-1px); }
  .card.hidden { display: none; }
  .card-q { font-size: 12px; font-weight: 700; margin-bottom: 7px; display: flex; align-items: center; gap: 6px; }
  .card-q-num { width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .card-title { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; line-height: 1.5; }
  .card-preview { font-size: 13px; color: #6c757d; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .card-link { font-size: 11px; color: #adb5bd; display: flex; align-items: center; gap: 4px; text-decoration: none; padding: 3px 8px; border-radius: 6px; border: 1px solid #e9ecef; transition: all .15s; background: #f8f9fa; }
  .card-arrow { color: #ced4da; font-size: 14px; transition: color .2s; }
  /* 섹션별 카드 색상 */
  .card[data-section=s1]{border-color:#c8f0e0}.card[data-section=s1]:hover{border-color:#0a9160}.card[data-section=s1] .card-q,.card[data-section=s1] .card-q-num{color:#0a9160}.card[data-section=s1] .card-q-num{background:#e6fdf5}.card[data-section=s1] .card-link:hover{color:#0a9160;border-color:#0a9160;background:#e6fdf5}.card[data-section=s1]:hover .card-arrow{color:#0a9160}
  .card[data-section=s2]{border-color:#ffd8b0}.card[data-section=s2]:hover{border-color:#e65100}.card[data-section=s2] .card-q,.card[data-section=s2] .card-q-num{color:#e65100}.card[data-section=s2] .card-q-num{background:#fff3e0}.card[data-section=s2] .card-link:hover{color:#e65100;border-color:#e65100;background:#fff3e0}.card[data-section=s2]:hover .card-arrow{color:#e65100}
  .card[data-section=s3]{border-color:#b6d9f7}.card[data-section=s3]:hover{border-color:#0c5fa5}.card[data-section=s3] .card-q,.card[data-section=s3] .card-q-num{color:#0c5fa5}.card[data-section=s3] .card-q-num{background:#e8f4fd}.card[data-section=s3] .card-link:hover{color:#0c5fa5;border-color:#0c5fa5;background:#e8f4fd}.card[data-section=s3]:hover .card-arrow{color:#0c5fa5}
  .card[data-section=s4]{border-color:#f5b8c8}.card[data-section=s4]:hover{border-color:#c62828}.card[data-section=s4] .card-q,.card[data-section=s4] .card-q-num{color:#c62828}.card[data-section=s4] .card-q-num{background:#fce4ec}.card[data-section=s4] .card-link:hover{color:#c62828;border-color:#c62828;background:#fce4ec}.card[data-section=s4]:hover .card-arrow{color:#c62828}
  .card[data-section=s5]{border-color:#ddb8f0}.card[data-section=s5]:hover{border-color:#6a1b9a}.card[data-section=s5] .card-q,.card[data-section=s5] .card-q-num{color:#6a1b9a}.card[data-section=s5] .card-q-num{background:#f3e5f5}.card[data-section=s5] .card-link:hover{color:#6a1b9a;border-color:#6a1b9a;background:#f3e5f5}.card[data-section=s5]:hover .card-arrow{color:#6a1b9a}
  mark { background: #fef9c3; color: #854d0e; border-radius: 2px; padding: 0 1px; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; max-width: 600px; width: 100%; max-height: 82vh; overflow-y: auto; padding: 28px; position: relative; }
  .modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid #e9ecef; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #6c757d; }
  .modal-close:hover { background: #f8f9fa; }
  .modal-section { font-size: 12px; font-weight: 600; color: #0a9160; margin-bottom: 6px; }
  .modal-q { font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 16px; line-height: 1.5; }
  .modal-body { font-size: 14px; color: #343a40; line-height: 1.85; }
  .modal-tip { margin-top: 14px; background: #f8f9fa; border-left: 3px solid #1de5a2; border-radius: 0 8px 8px 0; padding: 12px 14px; font-size: 13px; color: #495057; line-height: 1.6; }
  .modal-guide-link { margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #0a9160; text-decoration: none; background: #e6fdf5; padding: 8px 14px; border-radius: 8px; border: 1px solid #b2f0d8; transition: all .15s; }
  .modal-guide-link:hover { background: #d0faee; }
  .modal-nav { display: flex; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #e9ecef; }
  .modal-nav button { flex: 1; height: 38px; border-radius: 8px; border: 1px solid #e9ecef; background: #fff; font-size: 13px; color: #495057; cursor: pointer; }
  .modal-nav button:hover { background: #f8f9fa; }
  .loading { text-align: center; padding: 80px 20px; color: #adb5bd; }
  .loading-spinner { width: 32px; height: 32px; border: 3px solid #e9ecef; border-top-color: #1de5a2; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: #fff5f5; border: 1px solid #fed7d7; border-radius: 12px; padding: 20px 24px; margin: 20px 0; font-size: 14px; color: #c53030; line-height: 1.7; }
  .error-box code { background: #fed7d7; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  .search-empty { text-align: center; padding: 60px 20px; color: #adb5bd; }
  footer { text-align: center; padding: 32px 20px; color: #adb5bd; font-size: 13px; border-top: 1px solid #e9ecef; margin-top: 20px; }
  footer a { color: #0a9160; text-decoration: none; }
  @media (max-width: 600px) { .hero { flex-direction: column; padding: 24px; } .cards-grid { grid-template-columns: 1fr; } .page { padding-top: 115px; } }
</style>
</head>
<body>
<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-logo"><span class="logo-badge">배민</span>입점 초기 운영 Q&amp;A 가이드</div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="키워드로 검색 (예: 메뉴, 배달팁, 취소...)" autocomplete="off">
      <span class="search-icon">🔍</span>
    </div>
  </div>
</nav>
<div class="anchor-bar">
  <div class="anchor-inner" id="anchorInner"></div>
</div>
<div class="page">
  <div class="hero">
    <div class="hero-text">
      <h1>배민 파트너님을 위한<br>입점 초기 운영 Q&amp;A 가이드</h1>
      <p>가게 등록부터 환불 처리까지, 자주 묻는 질문을 한곳에서 확인하세요.<br>각 문항의 배민외식업광장 가이드 링크도 함께 제공됩니다.</p>
    </div>
    <div class="hero-stats">
      <div class="hero-stat"><strong id="totalCount">-</strong><span>개 Q&amp;A</span></div>
    </div>
  </div>
  <div id="mainContent">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p>구글 시트에서 데이터를 불러오는 중...</p>
    </div>
  </div>
  <div class="search-empty" id="searchEmpty" style="display:none;">
    <p>🔍 검색 결과가 없어요. 다른 키워드로 시도해보세요.</p>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div class="modal-section" id="modalSection"></div>
    <div class="modal-q" id="modalQ"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-tip" id="modalTip" style="display:none;"></div>
    <div id="modalLink"></div>
    <div class="modal-nav"><button onclick="navModal(-1)">← 이전 질문</button><button onclick="navModal(1)">다음 질문 →</button></div>
  </div>
</div>
<footer>배달의민족 파트너 전담센터 <a href="tel:16002111">1600-2111</a> &nbsp;|&nbsp; 배민셀프서비스에서 직접 설정하세요.</footer>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ★ 여기에 구글 시트 ID를 입력하세요 ★
const SHEET_ID = '19GOypbgeAEh2jHmnz5GaEeuX3EbZMDEoZ_LJliiuHDw';
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const SECTION_META = {
  s1: { label:'입점·등록',     bg:'#e6fdf5', color:'#0a9160', num:'01' },
  s2: { label:'주문·배달 운영', bg:'#fff3e0', color:'#e65100', num:'02' },
  s3: { label:'가게·운영관리', bg:'#e8f4fd', color:'#0c5fa5', num:'03' },
  s4: { label:'광고·노출전략', bg:'#fce4ec', color:'#c62828', num:'04' },
  s5: { label:'취소·환불·CS', bg:'#f3e5f5', color:'#6a1b9a', num:'05' },
};

const EXT = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

let allCards = [], currentCardIndex = -1, sectionsData = {};

// 구글 시트 CSV로 불러오기
async function loadFromSheet() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    return parseCSV(text);
  } catch(e) {
    throw e;
  }
}

function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim());
  const rows = lines.map(line => {
    const result = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    result.push(cur.trim());
    return result;
  });

  // 헤더 제외, 파트ID 기준으로 그룹핑
  // 컬럼: 파트, 파트ID, 번호, 질문, 답변, 팁, URL
  const data = {};
  for (let i = 1; i < rows.length; i++) {
    const [part, sid, num, q, body, tip, url] = rows[i];
    if (!sid || !q) continue;
    if (!data[sid]) data[sid] = [];
    data[sid].push({ q: q||'', body: body||'', tip: tip||'', url: url||'' });
  }
  return data;
}

function buildUI(data) {
  sectionsData = data;
  const main = document.getElementById('mainContent');
  const anchor = document.getElementById('anchorInner');
  main.innerHTML = '';
  anchor.innerHTML = '';

  let total = 0;
  const sids = Object.keys(SECTION_META);

  sids.forEach((sid, idx) => {
    const meta = SECTION_META[sid];
    const items = data[sid] || [];
    total += items.length;

    // 앵커 버튼
    const abtn = document.createElement('button');
    abtn.className = 'anchor-btn' + (idx === 0 ? ' active' : '');
    abtn.innerHTML = `<span class="anchor-dot"></span>${meta.label}`;
    abtn.onclick = () => scrollToSection(sid, abtn);
    anchor.appendChild(abtn);

    // 섹션
    const section = document.createElement('section');
    section.className = 'section';
    section.id = sid;
    section.innerHTML = `
      <div class="section-header">
        <div class="section-num" style="background:${meta.bg};color:${meta.color};">${meta.num}</div>
        <div class="section-title">${meta.label}</div>
        <div class="section-count">${items.length}개</div>
      </div>
      <div class="cards-grid" id="grid-${sid}"></div>`;
    main.appendChild(section);

    const grid = section.querySelector('.cards-grid');
    items.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.section = sid;
      card.dataset.index = i;
      card.innerHTML = `
        <div class="card-q">
          <span class="card-q-num">Q${i+1}</span>${meta.label}
        </div>
        <div class="card-title">${item.q}</div>
        <div class="card-preview">${item.body}</div>
        <div class="card-footer">
          ${item.url ? `<a class="card-link" href="${item.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${EXT} 배민외식업광장 가이드</a>` : '<span></span>'}
          <span class="card-arrow">→</span>
        </div>`;
      card.onclick = () => openModal(sid, i);
      grid.appendChild(card);
      allCards.push({ sid, index: i, el: card });
    });
  });

  document.getElementById('totalCount').textContent = total;
  setupObserver();
}

function openModal(sid, i) {
  const item = sectionsData[sid][i];
  const meta = SECTION_META[sid];
  document.getElementById('modalSection').textContent = meta.label + ' Q' + (i+1);
  document.getElementById('modalSection').style.color = meta.color;
  document.getElementById('modalQ').textContent = item.q;
  document.getElementById('modalBody').textContent = item.body;
  const te = document.getElementById('modalTip');
  if (item.tip) { te.textContent = item.tip; te.style.display = ''; } else { te.style.display = 'none'; }
  const le = document.getElementById('modalLink');
  le.innerHTML = item.url ? `<a class="modal-guide-link" href="${item.url}" target="_blank" rel="noopener">${EXT} 배민외식업광장 가이드 바로가기</a>` : '';
  document.getElementById('modalOverlay').classList.add('open');
  currentCardIndex = allCards.findIndex(c => c.sid === sid && c.index === i);
}

function closeModal(e) { if (e.target === document.getElementById('modalOverlay')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modalOverlay').classList.remove('open'); }

function navModal(dir) {
  const vis = allCards.filter(c => !c.el.classList.contains('hidden'));
  const cur = allCards[currentCardIndex];
  const vi = vis.findIndex(c => c === cur);
  const nx = vis[vi + dir];
  if (nx) openModal(nx.sid, nx.index);
}

function scrollToSection(id, btn) {
  document.querySelectorAll('.anchor-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
}

function hl(text, kw) {
  if (!kw) return text;
  return text.replace(new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>');
}

let timer;
document.getElementById('searchInput').addEventListener('input', function () {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const kw = this.value.trim();
    let any = false;
    allCards.forEach(c => {
      const item = sectionsData[c.sid][c.index];
      const txt = (item.q + ' ' + item.body).toLowerCase();
      const match = !kw || txt.includes(kw.toLowerCase());
      c.el.classList.toggle('hidden', !match);
      if (match) {
        c.el.querySelector('.card-title').innerHTML = hl(item.q, kw);
        c.el.querySelector('.card-preview').innerHTML = hl(item.body, kw);
        any = true;
      } else {
        c.el.querySelector('.card-title').textContent = item.q;
        c.el.querySelector('.card-preview').textContent = item.body;
      }
    });
    document.getElementById('searchEmpty').style.display = any ? 'none' : '';
  }, 150);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModalDirect();
  if (e.key === '/' && !e.target.matches('input')) { e.preventDefault(); document.getElementById('searchInput').focus(); }
});

function setupObserver() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        const id = en.target.id;
        document.querySelectorAll('.anchor-btn').forEach((b, i) => {
          b.classList.toggle('active', Object.keys(SECTION_META)[i] === id);
        });
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  Object.keys(SECTION_META).forEach(id => {
    const el = document.getElementById(id);
    if (el) obs.observe(el);
  });
}

// 시트 ID가 설정되지 않은 경우 안내
if (SHEET_ID === 'YOUR_SHEET_ID_HERE') {
  document.getElementById('mainContent').innerHTML = `
    <div class="error-box">
      <strong>⚙️ 구글 시트 연결이 필요해요</strong><br><br>
      이 파일의 상단 <code>SHEET_ID</code> 값을 구글 시트 ID로 바꿔주세요.<br><br>
      구글 시트 URL이 <code>https://docs.google.com/spreadsheets/d/<strong>abc123xyz</strong>/edit</code> 라면<br>
      <code>const SHEET_ID = 'abc123xyz';</code> 로 수정하면 됩니다.
    </div>`;
} else {
  loadFromSheet()
    .then(data => buildUI(data))
    .catch(err => {
      document.getElementById('mainContent').innerHTML = `
        <div class="error-box">
          <strong>⚠️ 데이터를 불러오지 못했어요</strong><br><br>
          구글 시트 공유 설정을 확인해 주세요.<br>
          시트 → 공유 → <strong>"링크가 있는 누구나 볼 수 있음"</strong>으로 설정해야 해요.<br><br>
          오류 내용: ${err.message}
        </div>`;
    });
}
</script>
</body>
</html>
